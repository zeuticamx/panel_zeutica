# Config de nginx del panel (reemplaza la default.conf de la imagen).
# Lo que más pesa en la carga es el JS y el CSS: van comprimidos y, como index.html
# los pide con ?v=, se cachean un día (subir el ?v= al modificar un archivo; si se
# olvida, el cambio tarda como mucho un día en llegar).

# Con ?v= se cachea un día; sin él, se revalida.
map $arg_v $cache_src {
    ""      "no-cache";
    default "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location /src/ {
        add_header Cache-Control $cache_src;
    }

    location /imagenes/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html y lo demás siempre se revalida: es lo que trae los ?v= nuevos tras un despliegue.
    location / {
        add_header Cache-Control "no-cache";
    }
}
